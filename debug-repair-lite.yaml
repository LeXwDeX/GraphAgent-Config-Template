# Lightweight reference for a deterministic, bounded defect.
title: "Debug and repair (lite): reproduce → fix → verify"
inputs:
  objective:
    description: >-
      The reproducible defect to repair: the symptom, the steps or command that
      trigger it, and where it was observed.
config:
  name: debug-repair-lite
  max_concurrency: 1
  max_node_replan_attempts: 2
  max_total_nodes: 15
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Repair one reproducible defect through a minimal causal patch and regression check.
    Request: {{objective}}
  acceptance:
    - id: AC1
      text: >-
        The reported symptom is reproduced by one deterministic command and no
        longer occurs after the repair.
    - id: AC2
      text: >-
        A regression check at the real seam fails without the fix and passes
        with it, and the affected package gate passes.
    - id: AC3
      text: >-
        The change is limited to the proven cause, with no unrelated cleanup.
  blocks:
    - id: lite-reproduce
      kind: debug
      instruction: >-
        Reproduce and minimize the exact symptom with one deterministic command.
        Establish the causal boundary and record unresolved hypotheses,
        concurrency, production-only state, or cross-module scope.

    - id: lite-repair-gate
      kind: review
      depends_on: [lite-reproduce]
      lenses: [standards, intent, completeness]
      report_to_parent: true
      instruction: >-
        Decide whether the evidence still satisfies this lite workflow's bounded,
        reversible, single-owner, no-high-risk premises. Return ACCEPT only when
        it does. Otherwise return REJECT with exact reasons and
        required actions. Do not name another workflow; the parent Router owns
        route and control changes. Completeness lens: at this gate an acceptance
        item counts as covered or partial when the evidence names the check or
        step that will establish it, and as missing only when it has no path to
        evidence; no item is expected to be delivered yet.

    - id: lite-repair
      kind: coding
      depends_on: [lite-repair-gate]
      instruction: >-
        Add the failing regression at the real seam, implement only the proven
        fix, make the check pass, and avoid unrelated cleanup.

    - id: lite-repair-verify
      kind: verify
      depends_on: [lite-repair]
      instruction: >-
        Re-run the original symptom, regression check, and affected package gate.
        Record cause, commands, results, and residual uncertainty.

    - id: lite-repair-review
      kind: review
      depends_on: [lite-repair-verify]
      lenses: [standards, intent, completeness]
      instruction: >-
        Check that the patch addresses the proven cause, the regression test
        observes real behavior, no assertion or error was weakened, and no
        unrelated cleanup entered the diff. Report blockers and residual risk.

    - id: lite-repair-report
      kind: synthesize
      depends_on: [lite-repair-review]
      instruction: >-
        Consolidate the reproduced symptom, proven fix, verification evidence,
        and review verdict into one final repair report. DELIVERY CONTRACT:
        write the complete report to a temporary markdown file under
        ${TMPDIR:-/tmp}/opencode-workflow-reports (create the directory if
        missing), named lite-repair-report.md, and verify the
        file is non-empty. Then submit ONLY that absolute file-path string as
        your output; do not include the report body or any other text.
