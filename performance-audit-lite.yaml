# Lightweight read-only reference for one reported regression or hot path.
title: "Performance audit (lite): baseline → inspect → measure"
inputs:
  objective:
    description: >-
      The reported regression or hot path to verify: what is slow, the workload
      that shows it, and the baseline to compare against.
config:
  name: performance-audit-lite
  max_concurrency: 2
  max_node_replan_attempts: 2
  max_total_nodes: 12
  node_defaults:
    worker_config:
      timeout_ms: 1800000
  objective: >-
    Verify one bounded performance concern against a repeatable user-relevant baseline.
    Request: {{objective}}
  acceptance:
    - id: AC1
      text: >-
        The concern is tested against a repeatable baseline: workload,
        environment, metric, threshold, and command.
    - id: AC2
      text: >-
        The report separates a verified bottleneck from measurement noise, a
        scale limit, and an unsupported idea, with the raw measurements.
    - id: AC3
      text: >-
        The smallest next fix and a regression benchmark are named.
  blocks:
    - id: lite-performance-baseline
      kind: explore
      instruction: >-
        Define the exact workload, environment, metric, threshold, and repeatable
        command. Record subsystem spread, saturation behavior, memory growth,
        and competing hypotheses.

    - id: lite-performance-gate
      kind: review
      depends_on: [lite-performance-baseline]
      lenses: [standards, intent, completeness]
      report_to_parent: true
      instruction: >-
        Decide whether the evidence still satisfies this lite workflow's bounded,
        reversible, single-owner, no-high-risk premises. Return ACCEPT only when
        it does. Otherwise return REJECT with exact reasons and
        required actions. Do not name another workflow; the parent Router owns
        route and control changes. Completeness lens: at this gate an acceptance
        item counts as covered or partial when the evidence names the check or
        step that will establish it, and as missing only when it has no path to
        evidence; no item is expected to be delivered yet.

    - id: lite-performance-measure
      kind: verify
      depends_on: [lite-performance-gate]
      instruction: >-
        Inspect the reachable hot path and run the smallest controlled benchmark
        or profile. Record raw measurements, variance, resource counters, and the
        implementation path that explains the cost.

    - id: lite-performance-decision
      kind: review
      depends_on: [lite-performance-measure]
      lenses: [standards, intent, completeness]
      instruction: >-
        Decide whether the concern is reproduced and material. Separate a
        verified bottleneck from measurement noise, scale limit, correctness bug,
        and unsupported optimization idea.

    - id: lite-performance-report
      kind: synthesize
      depends_on: [lite-performance-decision]
      instruction: >-
        Return baseline, measurements, root cause or refutation, expected impact,
        smallest next fix, and regression benchmark. DELIVERY CONTRACT: write
        the complete final report to a temporary markdown file under
        ${TMPDIR:-/tmp}/opencode-workflow-reports (create the directory if
        missing), named lite-performance-report.md, and
        verify the file is non-empty. Then submit ONLY that absolute file-path
        string as your output; do not include the report body or any other text.
